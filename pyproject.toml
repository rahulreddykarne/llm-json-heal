[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-json-heal"
version = "0.1.0"
description = "Extract, heal and parse JSON from messy LLM output: code fences, prose, trailing commas, missing commas, bad escapes and truncated replies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahul Karne" }]
keywords = ["llm", "json", "json-repair", "parser", "openai", "anthropic", "ollama", "structured-output"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rahulreddykarne/llm-json-heal"
Source = "https://github.com/rahulreddykarne/llm-json-heal"
Issues = "https://github.com/rahulreddykarne/llm-json-heal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_json_heal"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
